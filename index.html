<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0f4c8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家庭健康档案">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>家庭健康档案</title>
<style>
/* Sizes are in rem so the 字号 control (html font-size) scales everything together. */
:root {
  --bg: #f4f1ea;
  --card: #ffffff;
  --ink: #1c1b19;
  --ink2: #4b4a46;
  --line: #d9d4c8;
  --brand: #0f4c8a;
  --brand-soft: #e3edf8;
  --ok-ink: #17551f;
  --ok-bg: #e4f3e4;
  --warn-ink: #8a2c0b;
  --warn-bg: #fde9d9;
  --warn-line: #e9b48f;
  --mute-bg: #ecebe6;
  --series: #2a78d6;
  --flag: #b45309;
  --band: rgba(12, 163, 12, 0.10);
  --radius: 0.8rem;
}
html { font-size: 20px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html[data-size="2"] { font-size: 23px; }
html[data-size="3"] { font-size: 26px; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  -webkit-tap-highlight-color: rgba(15, 76, 138, 0.15);
}
h1, h2, h3, p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
.app { max-width: 34rem; margin: 0 auto; min-height: 100vh; }
.plain-msg { padding: 2rem 1rem; font-size: 1.1rem; }

/* ---------- lock screen ---------- */
.lock { padding: 2rem 1.2rem 2rem; text-align: center; }
.lock-mark {
  width: 4.4rem; height: 4.4rem; margin: 0.5rem auto 0.8rem; border-radius: 1.1rem;
  background: var(--brand); display: flex; align-items: center; justify-content: center;
}
.lock-mark svg { width: 2.6rem; height: 2.6rem; }
.lock h1 { font-size: 1.6rem; }
.lock-hint { font-size: 1.15rem; color: var(--ink2); margin-top: 0.3rem; }
.dots { height: 2.6rem; margin: 1rem 0 0.2rem; display: flex; align-items: center; justify-content: center; }
.dot { width: 1rem; height: 1rem; border-radius: 50%; background: var(--ink); margin: 0 0.35rem; }
.dots-empty { color: var(--ink2); font-size: 1rem; }
.lock-msg { min-height: 1.9rem; font-size: 1.05rem; font-weight: 600; color: var(--warn-ink); }
.lock-msg.busy { color: var(--brand); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 0.7rem; max-width: 20rem; margin: 0.6rem auto 0; }
.key {
  height: 4rem; border-radius: var(--radius); border: 2px solid var(--line); background: var(--card);
  font-size: 1.8rem; font-weight: 600; cursor: pointer; touch-action: manipulation;
}
.key:active { background: var(--brand-soft); border-color: var(--brand); }
.key-text { font-size: 1.15rem; }
.key-go { background: var(--brand); border-color: var(--brand); color: #fff; }
.key-go:active { background: #0b3a6b; }
.key:disabled { opacity: 0.5; }
.remember { display: flex; align-items: center; justify-content: center; margin-top: 1.3rem; font-size: 1rem; color: var(--ink2); cursor: pointer; }
.remember input { width: 1.5rem; height: 1.5rem; margin: 0 0.6rem 0 0; accent-color: var(--brand); }
.shake { animation: shake 0.35s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

/* ---------- chrome ---------- */
.top {
  position: sticky; top: 0; z-index: 5; background: var(--brand); color: #fff;
  display: flex; align-items: center; min-height: 3.4rem; padding: 0.3rem 0.5rem;
  padding-top: calc(0.3rem + env(safe-area-inset-top));
}
.top-title { flex: 1; min-width: 0; text-align: center; font-size: 1.2rem; font-weight: 700; line-height: 1.25; padding: 0 0.3rem; }
html[data-size="3"] .top-title { font-size: 1.05rem; }
.top-btn {
  min-width: 4.2rem; min-height: 2.7rem; padding: 0.2rem 0.6rem; border-radius: 0.6rem; border: 1.5px solid rgba(255,255,255,0.65);
  background: transparent; color: #fff; font-size: 0.95rem; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer;
}
.top-btn:active { background: rgba(255,255,255,0.2); }
.top-btn.ghost { border-color: transparent; visibility: hidden; }
.page { padding: 0.9rem 0.8rem 2rem; }
.has-tabs .page { padding-bottom: calc(6.4rem + env(safe-area-inset-bottom)); }
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--card); border-top: 1.5px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabs-in { max-width: 34rem; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab {
  min-height: 4rem; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 0.95rem; font-weight: 600; color: var(--ink2); border-top: 0.25rem solid transparent;
}
.tab svg { width: 1.5rem; height: 1.5rem; margin-bottom: 0.1rem; }
.tab.on { color: var(--brand); border-top-color: var(--brand); background: var(--brand-soft); }

/* ---------- common pieces ---------- */
.card { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 0.9rem; margin-bottom: 0.8rem; display: block; }
a.card:active, .row:active { background: var(--brand-soft); }
.h2 { font-size: 1.25rem; font-weight: 700; margin: 1.4rem 0.2rem 0.6rem; }
.h2 small { font-size: 0.95rem; font-weight: 400; color: var(--ink2); }
.note { font-size: 0.95rem; color: var(--ink2); margin: 0.4rem 0.2rem 0.8rem; }
.chip { display: inline-block; padding: 0.1rem 0.6rem; border-radius: 1rem; font-size: 0.95rem; font-weight: 700; }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.none { background: var(--mute-bg); color: var(--ink2); }
.more { color: var(--brand); font-weight: 700; }
.btn {
  display: flex; align-items: center; justify-content: center; width: 100%; min-height: 3.2rem; padding: 0.5rem 1rem;
  border-radius: var(--radius); border: 2px solid var(--brand); background: var(--card); color: var(--brand); font-size: 1.05rem; font-weight: 700; cursor: pointer;
}
.btn:active { background: var(--brand-soft); }

/* ---------- home (people) ---------- */
.person { display: flex; align-items: center; padding: 1.1rem 0.9rem; }
.avatar {
  flex: none; width: 3.6rem; height: 3.6rem; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
  font-size: 1.7rem; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-right: 0.9rem;
}
.person-main { flex: 1; min-width: 0; }
html[data-size="2"] .avatar { width: 2.8rem; height: 2.8rem; font-size: 1.3rem; margin-right: 0.6rem; }
html[data-size="3"] .avatar { display: none; }
.person-name { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
.person-sub { color: var(--ink2); font-size: 0.95rem; }
.arrow { flex: none; font-size: 1.8rem; color: var(--brand); margin-left: 0.4rem; line-height: 1; }

/* ---------- latest ---------- */
.banner { background: var(--brand-soft); border-color: #b9cfe8; }
.banner-label { font-size: 0.95rem; color: var(--ink2); }
.banner-date { font-size: 1.55rem; font-weight: 700; line-height: 1.35; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 0.7rem; margin-bottom: 0.8rem; }
.tile { border-radius: var(--radius); padding: 0.7rem 0.8rem; border: 1.5px solid var(--line); background: var(--card); }
.tile b { display: block; font-size: 2rem; line-height: 1.2; }
html[data-size="3"] .tile b { font-size: 1.6rem; }
.tile span { font-size: 0.95rem; }
.tile.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
.tile.ok { background: var(--ok-bg); border-color: #b5d8b5; color: var(--ok-ink); }

.item-name { font-size: 1.15rem; font-weight: 700; line-height: 1.4; }
.abbr { font-size: 0.85rem; font-weight: 400; color: var(--ink2); margin-left: 0.3rem; white-space: nowrap; }
.item-val { display: flex; align-items: baseline; flex-wrap: wrap; margin-top: 0.15rem; }
.val { font-size: 2rem; font-weight: 700; line-height: 1.25; margin-right: 0.35rem; }
.unit { font-size: 0.95rem; color: var(--ink2); margin-right: 0.7rem; }
.item-meta { font-size: 0.95rem; color: var(--ink2); margin-top: 0.2rem; }
.item-meta b { color: var(--ink); }
.item-more { font-size: 0.95rem; font-weight: 700; color: var(--brand); margin-top: 0.3rem; text-align: right; }
.nw { display: inline-block; }
.item.warn { border-left: 0.4rem solid var(--flag); }

details.group { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); margin-bottom: 0.7rem; overflow: hidden; }
details.group > summary {
  list-style: none; cursor: pointer; padding: 0.85rem 0.9rem; min-height: 3.4rem; display: flex; align-items: center; font-size: 1.1rem; font-weight: 700;
}
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary .sum-main { flex: 1; }
details.group > summary .sum-sub { display: block; font-size: 0.95rem; font-weight: 400; color: var(--ink2); }
summary .tog { flex: none; color: var(--brand); font-size: 0.95rem; font-weight: 700; margin-left: 0.5rem; }
summary .tog::after { content: "展开 ▾"; }
details[open] > summary .tog::after { content: "收起 ▴"; }
details.group > .rows { border-top: 1.5px solid var(--line); }

.row { display: flex; flex-wrap: wrap; align-items: center; padding: 0.7rem 0.9rem; border-bottom: 1px solid #ebe7de; min-height: 3.4rem; }
.row:last-child { border-bottom: 0; }
.row-main { flex: 1 1 8em; min-width: 0; padding-right: 0.5rem; }
.row-name { font-size: 1.05rem; font-weight: 600; line-height: 1.4; }
.row-ref { font-size: 0.85rem; color: var(--ink2); }
.row-side { flex: none; text-align: right; margin-left: auto; }
.row-val { font-size: 1.3rem; font-weight: 700; line-height: 1.3; }
.row-val small { font-size: 0.8rem; font-weight: 400; color: var(--ink2); margin-left: 0.2rem; }
.rows-card { padding: 0; overflow: hidden; }

/* ---------- AI reading ---------- */
.ai-head { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 0.7rem; }
.ai-badge { flex: none; background: var(--brand); color: #fff; font-size: 0.95rem; font-weight: 700; padding: 0.1rem 0.6rem; border-radius: 0.4rem; margin-right: 0.6rem; }
.ai-sub { flex: 1 1 10em; font-size: 0.85rem; color: var(--ink2); line-height: 1.45; }
.ai-play {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; width: 100%; min-height: 3.6rem; padding: 0.4rem 0.8rem;
  border: 0; border-radius: var(--radius); background: var(--brand); color: #fff; font-size: 1.2rem; font-weight: 700; cursor: pointer; touch-action: manipulation;
}
.ai-play:active { background: #0b3a6b; }
.ai-play[data-state="loading"] { background: #5f7fa3; }
.ai-play svg { width: 1.5rem; height: 1.5rem; margin-right: 0.5rem; }
.ai-play small { font-size: 0.85rem; font-weight: 400; margin-left: 0.7rem; }
.ai-prog { margin-top: 0.7rem; }
.ai-bar { height: 0.6rem; border-radius: 0.3rem; background: var(--brand-soft); overflow: hidden; }
.ai-bar i { display: block; height: 100%; width: 0; background: var(--series); }
.ai-time { margin-top: 0.3rem; font-size: 0.95rem; color: var(--ink2); font-variant-numeric: tabular-nums; }
.ai-ctl { display: grid; grid-template-columns: 1fr 1fr; grid-gap: 0.6rem; margin-top: 0.4rem; }
.ai-ctl button { min-height: 2.8rem; padding: 0.2rem 0.4rem; border-radius: 0.6rem; border: 2px solid var(--line); background: var(--card); color: var(--brand); font-size: 0.95rem; font-weight: 700; cursor: pointer; }
.ai-ctl button:active { background: var(--brand-soft); }
.ai-overview { margin-top: 0.9rem; }
.ai h3 { font-size: 1.1rem; color: var(--ink); margin: 1.1rem 0 0.3rem; }
/* The four parts of a reading get a coloured tab as well as their title. */
.ai h3[class] { padding-left: 0.6rem; border-left: 0.35rem solid var(--brand); }
.ai h3.ai-good { border-left-color: #2e8b3a; }
.ai h3.ai-bad { border-left-color: var(--flag); }
.ai-body h3 { color: var(--brand); font-size: 1.05rem; }
.ai ul, .ai ol { margin: 0; padding-left: 1.4rem; }
.ai li { margin-bottom: 0.45rem; }
details.ai-more { margin-top: 0.9rem; border-top: 1.5px solid var(--line); }
details.ai-more > summary { list-style: none; cursor: pointer; display: flex; align-items: center; min-height: 3.2rem; font-size: 1.05rem; font-weight: 700; }
details.ai-more > summary::-webkit-details-marker { display: none; }
details.ai-more > summary .sum-main { flex: 1; }
.ai-body p { margin-bottom: 0.3rem; }

/* ---------- trend / charts ---------- */
.chart-card { padding: 0.8rem 0.6rem 0.5rem; }
.chart-head { display: flex; flex-wrap: wrap; align-items: flex-start; padding: 0 0.3rem; }
.chart-head .item-name { flex: 1 1 6em; padding-right: 0.5rem; }
.chart-now { text-align: right; flex: none; margin-left: auto; max-width: 100%; }
.chart-now .row-val { font-size: 1.4rem; }
.chart svg { display: block; width: 100%; height: auto; }
.chart .pt { cursor: pointer; }
.chart-tip { margin: 0.2rem 0.3rem 0; padding: 0.4rem 0.6rem; border-radius: 0.5rem; background: var(--mute-bg); font-size: 0.95rem; }
.chart-tip:empty { display: none; }
.legend { display: flex; flex-wrap: wrap; font-size: 0.85rem; color: var(--ink2); padding: 0.2rem 0.3rem 0; }
.legend span { margin-right: 1rem; display: inline-flex; align-items: center; }
.legend i { display: inline-block; margin-right: 0.3rem; }
.lg-band { width: 1.1rem; height: 0.7rem; background: var(--band); border: 1px solid #a9d3a9; }
.lg-dot { width: 0.7rem; height: 0.7rem; border-radius: 50%; background: var(--series); }
.lg-tri { width: 0; height: 0; border-left: 0.4rem solid transparent; border-right: 0.4rem solid transparent; border-bottom: 0.7rem solid var(--flag); }
.single { font-size: 0.95rem; color: var(--ink2); padding: 0.3rem 0.3rem 0.2rem; }

/* ---------- visit / item detail ---------- */
.about { background: var(--brand-soft); border-color: #b9cfe8; }
.about h3 { font-size: 1rem; color: var(--brand); margin-bottom: 0.2rem; }
.hist-date { font-size: 1.05rem; font-weight: 700; }
.hist-sub { font-size: 0.85rem; color: var(--ink2); }
.report p { margin-bottom: 0.5rem; }
.report h3 { font-size: 1.05rem; margin: 0.6rem 0 0.3rem; color: var(--brand); }
.report h3:first-child { margin-top: 0; }
.report-body { padding-bottom: 0.3rem; }
.report ul { margin: 0; padding-left: 1.3rem; }
.report li { font-weight: 700; font-size: 1.1rem; }
.visit-count { font-size: 1rem; color: var(--ink2); }
.visit-count b { color: var(--ink); }

.settings { margin-top: 2rem; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); grid-gap: 0.5rem; margin-bottom: 0.8rem; }
.seg button { min-height: 3.2rem; border-radius: var(--radius); border: 2px solid var(--line); background: var(--card); font-weight: 700; cursor: pointer; }
.seg button.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
.seg .s1 { font-size: 20px; } .seg .s2 { font-size: 23px; } .seg .s3 { font-size: 26px; }
.foot { font-size: 0.85rem; color: var(--ink2); margin: 1.2rem 0.2rem 0; line-height: 1.7; }

.toast {
  position: fixed; left: 50%; bottom: 6rem; transform: translateX(-50%); z-index: 9; background: rgba(28,27,25,0.92); color: #fff;
  padding: 0.6rem 1.1rem; border-radius: 2rem; font-size: 1rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.2s; white-space: nowrap;
}
.toast.show { opacity: 1; }
.update-bar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 8; min-height: 3.4rem; padding: 0.5rem 1rem; padding-top: calc(0.5rem + env(safe-area-inset-top));
  border: 0; background: #1c1b19; color: #fff; font-size: 1.05rem; font-weight: 700; cursor: pointer;
}
:focus-visible { outline: 3px solid #f0a020; outline-offset: 2px; }
@media print {
  .top, .tabs, .settings, .toast, .update-bar, .ai-play, .ai-prog { display: none !important; }
  body { background: #fff; }
  details.group > .rows { display: block; }
}

</style>
</head>

<script>
// Family health record viewer. Everything personal arrives encrypted in #payload and is
// only decrypted in the browser after the password is entered (see tools/build.mjs).
// Syntax is kept conservative on purpose (no ?. / ?? / flat) so older phone browsers work.
(function () {
  'use strict';

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var PAYLOAD = null;
  var DB = null;          // decrypted + indexed data
  var RAWKEY = null;      // AES key bytes, kept while unlocked to decrypt the audio files
  var navStack = [];      // in-app history, used for 返回 and scroll restore
  var scrollMemo = {};
  var openMemo = {};      // which 展开 sections were open on each page, so 返回 finds them as they were left
  var KEY_STORE = 'hr.key';
  var SIZE_STORE = 'hr.size';
  var PERSON_STORE = 'hr.person';

  // ---------- small helpers ----------
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function store(k, v) {
    try {
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
    } catch (e) { /* private mode: just don't remember */ }
  }
  function load(k) {
    try { return localStorage.getItem(k); } catch (e) { return null; }
  }
  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(b) {
    var s = '';
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s);
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.className = 'toast show';
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.className = 'toast'; }, 1600);
  }
  function dateParts(d) { var p = d.split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
  function fmtDate(d) { var p = dateParts(d); return p.y + '年' + p.m + '月' + p.d + '日'; }
  function fmtShort(d) { var p = dateParts(d); return p.m + '月' + p.d + '日'; }
  function fmtTick(d) { var p = dateParts(d); return p.m + '/' + p.d; }
  function decimals(s) { var i = String(s).indexOf('.'); return i < 0 ? 0 : String(s).length - i - 1; }
  function num(s) { var n = parseFloat(s); return /^[0-9.]+$/.test(String(s)) && !isNaN(n) ? n : null; }

  // ---------- text size ----------
  function sizeLevel() { var n = parseInt(load(SIZE_STORE), 10); return n >= 1 && n <= 3 ? n : 1; }
  function applySize(n) {
    document.documentElement.setAttribute('data-size', String(n));
    store(SIZE_STORE, String(n));
  }
  var SIZE_NAMES = ['', '标准', '大', '特大'];

  // ---------- crypto ----------
  var subtle = window.crypto && window.crypto.subtle;
  function deriveKey(pin) {
    var enc = new TextEncoder();
    return subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']).then(function (base) {
      return subtle.deriveBits({ name: 'PBKDF2', salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' }, base, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  function decryptWith(rawKey) {
    return subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(PAYLOAD.iv) }, key, b64ToBytes(PAYLOAD.ct));
    }).then(function (buf) {
      RAWKEY = rawKey;
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }
  // An audio file is iv (12 bytes) + ciphertext, as written by tools/build.mjs.
  function decryptBytes(buf) {
    var bytes = new Uint8Array(buf);
    return subtle.importKey('raw', RAWKEY, 'AES-GCM', false, ['decrypt']).then(function (key) {
      return subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, key, bytes.subarray(12));
    });
  }

  // ---------- data indexing ----------
  function prepare(data) {
    var groupOrder = {};
    data.groups.forEach(function (g, i) { groupOrder[g.id] = i; });
    data.groupById = {};
    data.groups.forEach(function (g) { data.groupById[g.id] = g; });
    data.people.forEach(function (p) {
      p.visits.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
      p.series = {};
      p.visits.forEach(function (v) {
        v.items = [];
        (v.panels || []).forEach(function (panel) {
          panel.items.forEach(function (it) {
            it.date = v.date;
            it.method = panel.method || '';
            it.test = data.tests[it.c];
            it.n = num(it.v);
            v.items.push(it);
            (p.series[it.c] = p.series[it.c] || []).push(it);
          });
        });
        v.items.sort(function (a, b) { return groupOrder[a.test.group] - groupOrder[b.test.group]; });
      });
      p.labVisits = p.visits.filter(function (v) { return v.items.length > 0; });
    });
    data.personById = {};
    data.people.forEach(function (p) { data.personById[p.id] = p; });
    return data;
  }

  // What to say about one result. Wording follows the arrows printed on the lab report;
  // HBsAb is the one exception (high = protective antibody, not a problem).
  function status(it) {
    var t = it.test;
    if (t.kind === 'antibody') {
      return it.f === 'H' ? { cls: 'ok', text: '有抗体 ✓', word: '有抗体' } : { cls: 'none', text: '低于 10', word: '低于 10' };
    }
    if (t.kind === 'antigen') {
      return it.f === 'H' ? { cls: 'warn', text: '阳性 ↑', word: '阳性' } : { cls: 'ok', text: '阴性 ✓', word: '阴性' };
    }
    var drug = t.group === 'drug';
    if (it.f === 'H') return { cls: 'warn', text: drug ? '高于参考范围 ↑' : '偏高 ↑', word: drug ? '高于参考范围' : '偏高' };
    if (it.f === 'L') return { cls: 'warn', text: drug ? '低于参考范围 ↓' : '偏低 ↓', word: drug ? '低于参考范围' : '偏低' };
    if (it.lo == null && it.hi == null) return { cls: 'none', text: '无参考范围', word: '无参考范围' };
    return { cls: 'ok', text: drug ? '参考范围内 ✓' : '正常 ✓', word: drug ? '在参考范围内' : '正常' };
  }
  function chip(it) { var s = status(it); return '<span class="chip ' + s.cls + '">' + esc(s.text) + '</span>'; }
  function refText(it) {
    if (it.test.refNote) return it.test.refNote;
    if (!it.ref) return '';
    if (it.ref.charAt(0) === '<') return '小于 ' + it.ref.slice(1);
    return it.ref.replace('-', '–');
  }
  function refLine(it) {
    var r = refText(it);
    if (!r) return '化验单未给出参考范围';
    if (it.test.kind === 'antibody') return '<span class="nw">参考值 ' + esc(r) + '</span><span class="nw">（高于它表示有抗体）</span>';
    // A multi-part note (LDL-C lists three bands) has to be allowed to wrap.

  // ---------- AI readings ----------
  var ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
  var ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4.5h4.5v15H6zM13.5 4.5H18v15h-4.5z"/></svg>';
  function clock(secs) {

  function aiCard(ai) {

  // One shared <audio>. A reading's MP3 is downloaded encrypted, decrypted in memory and played
  // from a blob URL, so nothing audible is ever stored or served in the clear.
  var audio = null;
  var player = { file: null, state: 'idle', url: null };  // state: idle | loading | ready | playing | paused | ended
  var blobs = {};
  function silence() {
    if (silence.url) return silence.url;
    var n = 800, b = new Uint8Array(44 + n), v = new DataView(b.buffer), i;
    function put(at, text) { for (var k = 0; k < text.length; k++) b[at + k] = text.charCodeAt(k); }
    put(0, 'RIFF'); v.setUint32(4, 36 + n, true); put(8, 'WAVEfmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
    v.setUint16(32, 1, true); v.setUint16(34, 8, true); put(36, 'data'); v.setUint32(40, n, true);
    for (i = 44; i < b.length; i++) b[i] = 128;
    return (silence.url = URL.createObjectURL(new Blob([b], { type: 'audio/wav' })));
  }
  function getAudio() {
    if (!audio) {
      audio = new Audio();
      ['play', 'playing', 'pause', 'ended', 'timeupdate', 'durationchange'].forEach(function (name) {
        audio.addEventListener(name, onAudioEvent);
      });
    }
    return audio;
  }
  function onAudioEvent(e) {
    if (!player.url || audio.src !== player.url) return;  // events from the silent primer
    if (e.type === 'ended') player.state = 'ended';
    else if (e.type === 'play' || e.type === 'playing') player.state = 'playing';
    else if (e.type === 'pause' && player.state === 'playing' && !audio.ended) player.state = 'paused';
    syncPlayer();
  }
  function loadAudio(file) {
    if (blobs[file]) return Promise.resolve(blobs[file]);
    return fetch(file).then(function (res) {
      if (!res.ok) throw new Error('http ' + res.status);
      return res.arrayBuffer();
    }).then(decryptBytes).then(function (buf) {
      return (blobs[file] = URL.createObjectURL(new Blob([buf], { type: 'audio/mpeg' })));
    });
  }
  function tryPlay() {
    var p = audio.play();
    if (p && p.catch) p.catch(function () {
      // The phone refused to start by itself: leave a button that starts it with one more tap.
      if (player.state !== 'playing') { player.state = 'ready'; syncPlayer(); }
    });
  }
  function stopAudio() {
    if (audio) { audio.pause(); audio.removeAttribute('src'); audio.load(); }
    player = { file: null, state: 'idle', url: null };
    syncPlayer();
  }
  function togglePlay(file) {
    var a = getAudio();
    if (player.file === file) {
      if (player.state === 'playing') a.pause();

    }
    stopAudio();
    player.file = file; player.state = 'loading';
    syncPlayer();
    // Start something inside the tap itself. Phones only allow the play() that follows the
    // download and decryption on an <audio> element the user has already started once.
    a.loop = true; a.src = silence();
    var primed = a.play();
    if (primed && primed.catch) primed.catch(function () {});
    loadAudio(file).then(function (url) {
      if (player.file !== file) return;
      player.url = url; a.loop = false; a.src = url;
      tryPlay();
    }).catch(function () {
      if (player.file !== file) return;
      stopAudio();
      toast('语音没有加载成功，请稍后再试');
    });
  }
  // Brings every play button and progress bar on the page in line with the player.
  function syncPlayer() {
    var buttons = app.querySelectorAll('.ai-play'), i;
    for (i = 0; i < buttons.length; i++) {
      var b = buttons[i], mine = b.getAttribute('data-audio') === player.file, st = mine ? player.state : 'idle';
      var label = st === 'loading' ? '正在准备语音…' : st === 'playing' ? ICON_PAUSE + '暂停'
        : st === 'paused' ? ICON_PLAY + '继续听' : st === 'ready' ? ICON_PLAY + '点这里开始播放'
        : st === 'ended' ? ICON_PLAY + '再听一遍'
        : ICON_PLAY + '听这段解读<small>约 ' + Math.max(1, Math.round(b.getAttribute('data-secs') / 60)) + ' 分钟</small>';
      if (b.getAttribute('data-state') !== st) { b.setAttribute('data-state', st); b.innerHTML = label; }
    }
    var bars = app.querySelectorAll('.ai-prog');
    for (i = 0; i < bars.length; i++) {
      var on = bars[i].getAttribute('data-for') === player.file && player.url && player.state !== 'loading';
      bars[i].hidden = !on;
      if (!on) continue;
      var total = isFinite(audio.duration) && audio.duration ? audio.duration : 0;
      bars[i].querySelector('i').style.width = (total ? Math.min(100, audio.currentTime / total * 100) : 0) + '%';
      bars[i].querySelector('.ai-time').textContent = clock(audio.currentTime) + ' / ' + clock(total);
    }
  }

  // ---------- charts ----------
  // One series per chart, even spacing (visits are labelled with their dates), reference
  // range drawn as a green band. Out-of-range points change shape as well as colour.
  function chartPoints(series) {
    var pts = series.filter(function (it) { return it.n != null; });
    var max = sizeLevel() === 3 ? 4 : (sizeLevel() === 2 ? 5 : 6);
    return pts.slice(-max);
  }
  function chartSVG(person, test, pts, big) {
    var fs = [0, 1, 1.12, 1.25][sizeLevel()];
    var W = 340, H = big ? 220 : 168, f = 14 * fs;
    var padX = 8, padT = f * 1.5 + 14, padB = f * 2.5 + 8;
    var plotH = H - padT - padB, n = pts.length, slot = (W - padX * 2) / n;
    var vals = pts.map(function (p) { return p.n; });
    var dmin = Math.min.apply(null, vals), dmax = Math.max.apply(null, vals);
    var last = pts[n - 1], lo = last.lo, hi = last.hi;
    var showBand = test.kind !== 'antibody' && (lo != null || hi != null);
    if (showBand) {
      // Always bring the nearer limit into view; the far one only if it does not squash the line.
      var cands = [];
      if (lo != null) cands.push(lo);
      if (hi != null) cands.push(hi);
      cands.sort(function (a, b) { return dist(a) - dist(b); });
      var a0 = Math.min(dmin, cands[0]), a1 = Math.max(dmax, cands[0]);
      if (cands.length > 1) {
        var b0 = Math.min(a0, cands[1]), b1 = Math.max(a1, cands[1]);
        if (b1 - b0 <= 2.5 * Math.max(a1 - a0, 1e-9)) { a0 = b0; a1 = b1; }
      }
      dmin = a0; dmax = a1;
    }
    function dist(b) { return b < dmin ? dmin - b : (b > dmax ? b - dmax : 0); }
    var span = dmax - dmin;
    if (span <= 0) span = Math.abs(dmax) * 0.2 || 1;
    var y0 = dmin - span * 0.12, y1 = dmax + span * 0.12;
    if (dmin >= 0 && y0 < 0) y0 = 0;
    function X(i) { return padX + slot * (i + 0.5); }
    function Y(v) { return padT + plotH * (1 - (v - y0) / (y1 - y0)); }
    var s = '';
    if (showBand) {
      var floor = H - padB + 7;
      var top = hi != null ? Math.max(Y(hi), 0) : 0;
      var bot = lo != null ? Math.min(Y(lo), floor) : floor;
      if (bot > top) s += '<rect x="0" y="' + top.toFixed(1) + '" width="' + W + '" height="' + (bot - top).toFixed(1) + '" fill="rgba(12,163,12,0.10)"/>';
      [lo, hi].forEach(function (b) {
        if (b != null && Y(b) > 0 && Y(b) < floor) {
          s += '<line x1="0" x2="' + W + '" y1="' + Y(b).toFixed(1) + '" y2="' + Y(b).toFixed(1) + '" stroke="#9ccf9c" stroke-width="1"/>';
        }
      });
    }
    s += '<line x1="0" x2="' + W + '" y1="' + (H - padB + 7) + '" y2="' + (H - padB + 7) + '" stroke="#bdb8ac" stroke-width="1"/>';
    if (n > 1) {
      s += '<polyline fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="' +
        pts.map(function (p, i) { return X(i).toFixed(1) + ',' + Y(p.n).toFixed(1); }).join(' ') + '"/>';
    }
    var desc = [];
    pts.forEach(function (p, i) {
      var x = X(i), y = Y(p.n), st = status(p), mark;
      if (st.cls === 'warn') {
        var d = p.f === 'L' ? 1 : -1; // triangle points the way the value is off
        mark = '<path d="M' + x + ' ' + (y + d * 9) + ' L' + (x - 8.5) + ' ' + (y - d * 6) + ' L' + (x + 8.5) + ' ' + (y - d * 6) + ' Z" fill="#b45309" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>';
      } else {
        mark = '<circle cx="' + x + '" cy="' + y.toFixed(1) + '" r="6.5" fill="#2a78d6" stroke="#fff" stroke-width="2"/>';
      }
      var tip = fmtDate(p.date) + '：' + p.v + (test.unit ? ' ' + test.unit : '') + '，' + st.word + (refText(p) ? '（参考范围 ' + refText(p) + '）' : '');
      desc.push(fmtShort(p.date) + ' ' + p.v);
      var yr = (i === 0 || dateParts(p.date).y !== dateParts(pts[i - 1].date).y)
        ? '<text x="' + x + '" y="' + (H - 4) + '" text-anchor="middle" font-size="' + (f * 0.8).toFixed(1) + '" fill="#4b4a46">' + dateParts(p.date).y + '年</text>' : '';
      s += '<g class="pt" data-tip="' + esc(tip) + '">' +
        '<rect x="' + (x - slot / 2).toFixed(1) + '" y="0" width="' + slot.toFixed(1) + '" height="' + H + '" fill="transparent"/>' + mark +
        '<text x="' + x + '" y="' + (y - 13).toFixed(1) + '" text-anchor="middle" font-size="' + f.toFixed(1) + '" font-weight="700" fill="#1c1b19" stroke="#fff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">' + esc(p.v) + '</text>' +
        '<text x="' + x + '" y="' + (H - padB + 9 + f).toFixed(1) + '" text-anchor="middle" font-size="' + (f * 0.92).toFixed(1) + '" fill="#4b4a46">' + fmtTick(p.date) + '</text>' + yr +
        '</g>';
    });
    var legend = '<div class="legend">' +
      (showBand ? '<span><i class="lg-band"></i>参考范围 ' + esc(refText(last)) + '</span>' : '') +
      (pts.some(function (p) { return status(p).cls === 'warn'; }) ? '<span><i class="lg-tri"></i>不在参考范围</span>' : '') + '</div>';
    return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(test.name + ' 历次结果：' + desc.join('，')) + '">' + s + '</svg>' +
      legend + '<div class="chart-tip" aria-live="polite"></div></div>';
  }
  function chartCard(person, code) {
    var series = person.series[code], test = DB.tests[code], last = series[series.length - 1];

  function pageLatest(person) {

    var h = '<div class="card banner"><div class="banner-label">最近一次检查</div><div class="banner-date">' + fmtDate(v.date) + '</div>' +
      '<div class="banner-label">' + esc(v.hospital) + ' · 抽血查了 ' + c.total + ' 项' +
      ((v.reports || []).length ? '，另有 ' + v.reports.length + ' 份影像报告' : '') + '</div></div>';
    // A later visit without blood tests (imaging only) must not go unnoticed on this page.
    person.visits.filter(function (x) { return x.date > v.date; }).forEach(function (x) {
      h += '<a class="card person" href="#/p/' + person.id + '/visit/' + x.date + '"><div class="person-main">' +
        '<div class="banner-label">之后还有一次检查</div><div class="item-name">' + fmtDate(x.date) + '</div>' +
        '<div class="person-sub">' + esc(reportTitles(x)) + '</div></div><div class="arrow" aria-hidden="true">›</div></a>';
    });
    h += '<div class="tiles"><div class="tile ' + (c.warn ? 'warn' : 'ok') + '"><b>' + c.warn + ' 项</b><span>不在参考范围内</span></div>' +
      '<div class="tile ok"><b>' + c.ok + ' 项</b><span>在参考范围内</span></div></div>';
    if (c.none) h += '<p class="note">另有 ' + c.none + ' 项化验单上没有给参考范围。</p>';
    h += aiCard(v.ai);
    (v.reports || []).forEach(function (r) { h += reportCard(r, true); });
    byGroup(v.items).forEach(function (g) {
      var isDrug = g.group.id === 'drug';
      var cards = [], rest = [];
      g.items.forEach(function (it) {
        var st = status(it).cls;
        if (isDrug || st === 'warn' || (st === 'none' && it.test.key)) cards.push(it); else rest.push(it);
      });
      var warnN = g.items.filter(function (it) { return status(it).cls === 'warn'; }).length;
      h += '<div class="h2">' + esc(g.group.name) + ' <small>' + (warnN ? warnN + ' 项不在参考范围' : '都在参考范围内') + '</small></div>';
      if (isDrug && g.group.about) h += '<p class="note">' + esc(g.group.about) + '</p>';
      h += cards.map(function (it) { return itemCard(person, it, false); }).join('');
      if (rest.length) {
        var label = cards.length ? '其余 ' + rest.length + ' 项' : '✓ 全部 ' + rest.length + ' 项';
        h += '<details class="group"><summary><span class="sum-main">' + label +
          '<span class="sum-sub">都在参考范围内</span></span><span class="tog"></span></summary><div class="rows">' +
          rest.map(function (it) { return itemRow(person, it); }).join('') + '</div></details>';
      }
    });
    var older = person.visits.filter(function (x) { return x.date < v.date; });
    if (older.length) h += '<a class="btn" style="margin-top:1.2rem" href="#/p/' + person.id + '/history">查看以前的检查（' + older.length + ' 次）</a>';
    return personTop(person) + '<main class="page">' + h + settingsBlock() + '</main>' + tabBar(person, 'latest');
  }

  function pageTrend(person) {
    var codes = Object.keys(person.series);
    var keys = codes.filter(function (c) { return DB.tests[c].key; });
    var groupIndex = {};
    DB.groups.forEach(function (g, i) { groupIndex[g.id] = i; });
    keys.sort(function (a, b) { return groupIndex[DB.tests[a].group] - groupIndex[DB.tests[b].group]; });
    var h = '<p class="note">每一项指标历次检查的变化。绿色区域是化验单上的参考范围；点一下图上的点，可以看那一次的日期和结果。</p>';
    h += '<div class="h2">重点指标</div>' + keys.map(function (c) { return chartCard(person, c); }).join('');
    h += '<div class="h2">全部指标 <small>按类别展开</small></div>';
    DB.groups.forEach(function (g) {
      var inGroup = codes.filter(function (c) { return DB.tests[c].group === g.id; });
      if (!inGroup.length) return;
      h += '<details class="group" data-lazy="' + person.id + '|' + g.id + '"><summary><span class="sum-main">' + esc(g.name) +
        '<span class="sum-sub">' + inGroup.length + ' 项</span></span><span class="tog"></span></summary><div class="rows" style="padding:0.7rem 0.6rem 0"></div></details>';
    });
    return personTop(person) + '<main class="page">' + h + settingsBlock() + '</main>' + tabBar(person, 'trend');
  }
  function fillLazy(el) {
    var parts = el.getAttribute('data-lazy').split('|'), person = DB.personById[parts[0]];
    el.removeAttribute('data-lazy');
    var g = DB.groupById[parts[1]];
    var html = g.about ? '<p class="note">' + esc(g.about) + '</p>' : '';
    Object.keys(person.series).forEach(function (c) {
      if (DB.tests[c].group === parts[1]) html += chartCard(person, c);
    });
    el.querySelector('.rows').innerHTML = html;
  }

  function pageHistory(person) {
    var h = '<p class="note">每一次检查的完整结果，最新的排在最上面。</p>';
    person.visits.slice().reverse().forEach(function (v) {
      var c = visitCounts(v), reports = v.reports || [];
      var line = v.items.length
        ? '查了 <b>' + c.total + '</b> 项' + (c.warn ? '，<span class="chip warn">' + c.warn + ' 项不在参考范围</span>' : '，<span class="chip ok">都在参考范围内</span>') +
          (reports.length ? '<br>另有：' + esc(reportTitles(v)) : '')
        : esc(reportTitles(v));
      h += '<a class="card person" href="#/p/' + person.id + '/visit/' + v.date + '"><div class="person-main">' +
        '<div class="banner-date">' + fmtDate(v.date) + '</div><div class="person-sub">' + esc(v.hospital) + '</div>' +
        '<div class="visit-count">' + line + '</div></div><div class="arrow" aria-hidden="true">›</div></a>';
    });
    return personTop(person) + '<main class="page">' + h + settingsBlock() + '</main>' + tabBar(person, 'history');
  }

  function pageVisit(person, date) {
    var v = person.visits.filter(function (x) { return x.date === date; })[0];
    if (!v) return null;
    var c = visitCounts(v);
    var h = '<div class="card banner"><div class="banner-label">' + esc(person.name) + ' 的检查</div><div class="banner-date">' + fmtDate(v.date) + '</div>' +
      '<div class="banner-label">' + esc(v.hospital) + (v.items.length ? ' · 共 ' + c.total + ' 项，' + c.warn + ' 项不在参考范围' : '') + '</div></div>';
    h += aiCard(v.ai);
    (v.reports || []).forEach(function (r) { h += reportCard(r, false); });
    byGroup(v.items).forEach(function (g) {
      var warnN = g.items.filter(function (it) { return status(it).cls === 'warn'; }).length;
      h += '<div class="h2">' + esc(g.group.name) + ' <small>' + g.items.length + ' 项' + (warnN ? '，' + warnN + ' 项不在参考范围' : '') + '</small></div>' +
        '<div class="card rows-card">' + g.items.map(function (it) { return itemRow(person, it); }).join('') + '</div>';
    });
    return topBar(fmtShort(v.date) + '的检查', { href: '#/p/' + person.id + '/history', text: '返回', back: true }) + '<main class="page">' + h + '</main>';
  }

  function pageItem(person, code) {
    var series = person.series[code];
    if (!series) return null;
    var test = DB.tests[code], last = series[series.length - 1], pts = chartPoints(series);
    var h = '<div class="card item ' + (status(last).cls === 'warn' ? 'warn' : '') + '">' +
      '<div class="hist-sub">' + esc(DB.groupById[test.group].name) + ' · ' + esc(person.name) + '</div>' +
      '<div class="item-name" style="font-size:1.4rem">' + esc(test.name) + '</div>' +
      '<div class="hist-sub">化验单上写作：' + esc(test.full) + (test.abbr ? '（' + esc(test.abbr) + '）' : '') + '</div>' +
      '<div class="item-val" style="margin-top:0.5rem"><span class="val">' + esc(last.v) + '</span>' + unitHtml(last) + chip(last) + '</div>' +
      '<div class="item-meta"><span class="nw">' + fmtDate(last.date) + '</span> · ' + refLine(last) + '</div></div>';
    h += '<div class="card about"><h3>这项检查看什么</h3><p>' + esc(test.about) + '</p></div>';
    h += '<div class="h2">历次变化</div>';
    h += pts.length >= 2 ? '<div class="card chart-card">' + chartSVG(person, test, pts, true) + '</div>'
      : '<div class="card"><p class="single">只查过一次，还看不出变化。</p></div>';
    h += '<div class="h2">每一次的结果 <small>共 ' + series.length + ' 次</small></div><div class="card rows-card">' +
      series.slice().reverse().map(function (it) {
        return '<div class="row"><div class="row-main"><div class="hist-date">' + fmtDate(it.date) + '</div>' +
          '<div class="row-ref">' + refLine(it) + '</div>' + (it.method ? '<div class="row-ref">方法：' + esc(it.method) + '</div>' : '') + '</div>' +
          '<div class="row-side"><div class="row-val">' + esc(it.v) + (test.unit ? '<small>' + esc(test.unit) + '</small>' : '') + '</div>' + chip(it) + '</div></div>';
      }).join('') + '</div>';
    return topBar(test.name, { href: '#/p/' + person.id, text: '返回', back: true }) + '<main class="page">' + h + '</main>';
  }

  // ---------- routing ----------
  function route() {
    var hash = location.hash.replace(/^#/, '') || '/';
    var seg = hash.split('/').filter(Boolean);
    var html = null, tabs = false;
    if (seg[0] === 'p' && DB.personById[seg[1]]) {
      var person = DB.personById[seg[1]];
      store(PERSON_STORE, person.id);
      if (!seg[2]) { html = pageLatest(person); tabs = true; }
      else if (seg[2] === 'trend') { html = pageTrend(person); tabs = true; }
      else if (seg[2] === 'history') { html = pageHistory(person); tabs = true; }
      else if (seg[2] === 'visit') html = pageVisit(person, seg[3]);
      else if (seg[2] === 'item') html = pageItem(person, seg[3]);
    }
    if (html === null) {
      if (seg.length && seg[0] !== '') { location.replace('#/'); if (hash !== '/') return; }
      if (DB.people.length === 1) { location.replace('#/p/' + DB.people[0].id); return; }
      html = pageHome();
    }
    app.className = 'app' + (tabs ? ' has-tabs' : '');
    app.innerHTML = html;
    // A reading keeps playing only while its card is on the page.
    if (player.file && !app.querySelector('.ai-play[data-audio="' + player.file + '"]')) stopAudio(); else syncPlayer();
  }
  function openSections() {
    var out = [], all = app.querySelectorAll('details');
    for (var i = 0; i < all.length; i++) if (all[i].open) out.push(i);
    return out;
  }
  function reopen(list) {
    var all = app.querySelectorAll('details');
    (list || []).forEach(function (i) {
      if (!all[i]) return;
      if (all[i].getAttribute('data-lazy')) fillLazy(all[i]);
      all[i].open = true;
    });
  }
  // Redraw the current page (after a text-size change) without collapsing what the reader had expanded.
  function rerender() {
    var keep = openSections();
    route();
    reopen(keep);
  }
  function onHashChange() {
    if (!DB) return;
    var h = location.hash || '#/';
    var prev = navStack[navStack.length - 1];
    if (prev) { scrollMemo[prev] = window.pageYOffset; openMemo[prev] = openSections(); }
    var back = navStack.length > 1 && navStack[navStack.length - 2] === h;
    if (back) navStack.pop(); else if (prev !== h) navStack.push(h);
    route();
    if (back) reopen(openMemo[h]);
    window.scrollTo(0, back ? (scrollMemo[h] || 0) : 0);
  }

  // ---------- lock screen ----------
  var pin = '', busy = false;
  function renderLock(msg) {
    var dots = '';
    for (var i = 0; i < pin.length; i++) dots += '<span class="dot"></span>';
    var keys = '';
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(function (k) { keys += '<button type="button" class="key" data-key="' + k + '">' + k + '</button>'; });
    keys += '<button type="button" class="key key-text" data-key="del">删除</button><button type="button" class="key" data-key="0">0</button>' +
      '<button type="button" class="key key-text key-go" data-key="go">确定</button>';
    app.className = 'app';
    app.innerHTML = '<main class="lock"><div class="lock-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></div>' +
      '<h1>' + esc(PAYLOAD.title) + '</h1><p class="lock-hint">请输入密码，然后按“确定”</p>' +
      '<div class="dots" id="dots" aria-label="已输入 ' + pin.length + ' 位">' + (dots || '<span class="dots-empty">还没有输入</span>') + '</div>' +
      '<p class="lock-msg' + (busy ? ' busy' : '') + '" id="lockmsg" role="alert">' + esc(msg || '') + '</p>' +
      '<div class="pad">' + keys + '</div>' +
      '<label class="remember"><input type="checkbox" id="remember"' + (renderLock.remember ? ' checked' : '') + '>在这台手机上记住密码</label></main>';
  }
  renderLock.remember = true;
  function pressKey(k) {
    if (busy) return;
    if (k === 'del') pin = pin.slice(0, -1);
    else if (k === 'go') return tryUnlock();
    else if (pin.length < 12) pin += k;
    renderLock('');
  }
  function tryUnlock() {
    if (!pin) return renderLock('请先输入密码');
    busy = true;
    renderLock('正在打开，请稍等…');
    var rawKey;
    deriveKey(pin).then(function (k) { rawKey = k; return decryptWith(k); }).then(function (data) {
      if (renderLock.remember) store(KEY_STORE, bytesToB64(rawKey));
      busy = false; pin = '';
      open(data);
    }).catch(function () {
      busy = false; pin = '';
      renderLock('密码不对，请再试一次');
      var d = document.getElementById('dots');
      if (d) d.className = 'dots shake';
    });
  }
  function open(data) {
    DB = prepare(data);
    DB.updated = data.updated;
    navStack = [];
    var remembered = load(PERSON_STORE);
    if (!location.hash || location.hash === '#/') {
      if (DB.people.length === 1) location.replace('#/p/' + DB.people[0].id);
      else if (remembered && DB.personById[remembered] && !open.done) location.replace('#/p/' + remembered);
    }
    open.done = true;
    navStack.push(location.hash || '#/');
    route();
    window.scrollTo(0, 0);
  }
  function lock() {
    store(KEY_STORE, null);
    stopAudio();
    Object.keys(blobs).forEach(function (f) { URL.revokeObjectURL(blobs[f]); });
    blobs = {};
    DB = null; RAWKEY = null; pin = '';
    if (history.replaceState) history.replaceState(null, '', location.pathname + location.search);
    renderLock('已锁定');
  }

  // ---------- events ----------
  document.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t.nodeType === 1 && t !== document.documentElement) {
      if (t.hasAttribute('data-key')) { pressKey(t.getAttribute('data-key')); return; }
      if (t.hasAttribute('data-set-size')) { applySize(+t.getAttribute('data-set-size')); rerender(); toast('字号：' + SIZE_NAMES[sizeLevel()]); return; }
      if (t.hasAttribute('data-tip')) {
        var card = t.parentNode;
        while (card && !(card.className && String(card.className).indexOf('chart') === 0 && card.tagName === 'DIV')) card = card.parentNode;
        if (card) card.querySelector('.chart-tip').textContent = t.getAttribute('data-tip');
        return;
      }
      var act = t.getAttribute('data-act');
      if (act === 'size') { applySize(sizeLevel() % 3 + 1); if (DB) rerender(); toast('字号：' + SIZE_NAMES[sizeLevel()]); return; }
      if (act === 'lock') { lock(); return; }
      if (act === 'reload') { location.reload(); return; }
      if (t.hasAttribute('data-audio')) { togglePlay(t.getAttribute('data-audio')); return; }
      if (act === 'back15' && audio) { audio.currentTime = Math.max(0, audio.currentTime - 15); syncPlayer(); return; }
      if (act === 'restart' && audio) { audio.currentTime = 0; tryPlay(); return; }
      if (act === 'back' && navStack.length > 1) { e.preventDefault(); history.back(); return; }
      t = t.parentNode;
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'remember') renderLock.remember = e.target.checked;
  });
  document.addEventListener('keydown', function (e) {
    if (DB || e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^[0-9]$/.test(e.key)) pressKey(e.key);
    else if (e.key === 'Backspace') pressKey('del');
    else if (e.key === 'Enter') pressKey('go');
  });
  // <details> toggle does not bubble, so listen in the capture phase.
  document.addEventListener('toggle', function (e) {
    var el = e.target;
    if (el && el.open && el.getAttribute && el.getAttribute('data-lazy')) fillLazy(el);
  }, true);
  window.addEventListener('hashchange', onHashChange);

  // ---------- staying up to date ----------
  // A page left open, or resumed from the home screen, would otherwise keep showing whatever it
  // loaded days ago. Whenever it comes back into view, compare its build id with the server's.
  var lastCheck = 0;
  function checkForUpdate() {
    if (!PAYLOAD || !PAYLOAD.b || !window.fetch || Date.now() - lastCheck < 60000) return;
    lastCheck = Date.now();
    fetch(location.pathname, { cache: 'no-store' }).then(function (res) {
      return res.ok ? res.text() : '';
    }).then(function (html) {
      var m = /"b":"([0-9a-f]+)"/.exec(html);
      if (m && m[1] !== PAYLOAD.b) applyUpdate();
    }).catch(function () { /* offline: keep what we have */ });
  }
  function applyUpdate() {
    // Not in the middle of listening; try again when the reader next comes back.
    if (player.state === 'playing' || player.state === 'loading') { lastCheck = 0; return; }
    // Reloading is seamless on the lock screen or when the password is remembered. Otherwise it
    // would ask for the password out of the blue, so offer the update instead.
    if (!DB || load(KEY_STORE)) { location.reload(); return; }
    if (!document.getElementById('update')) {
      var bar = document.createElement('button');
      bar.id = 'update'; bar.type = 'button'; bar.className = 'update-bar';
      bar.setAttribute('data-act', 'reload');
      bar.textContent = '内容有更新，点这里刷新（需要重新输入密码）';
      document.body.appendChild(bar);
    }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkForUpdate(); });
  window.addEventListener('focus', checkForUpdate);
  window.addEventListener('pageshow', function (e) { if (e.persisted) checkForUpdate(); });

  // ---------- start ----------
  applySize(sizeLevel());
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  try { PAYLOAD = JSON.parse(document.getElementById('payload').textContent); } catch (e) { PAYLOAD = null; }
  if (!PAYLOAD || !PAYLOAD.ct) {
    app.innerHTML = '<p class="plain-msg">页面数据没有加载完整，请刷新再试。</p>';
    return;
  }
  document.title = PAYLOAD.title;
  if (!subtle || !window.TextDecoder) {
    app.innerHTML = '<p class="plain-msg">这个浏览器版本太旧，打不开加密的内容。请换用手机自带的浏览器或微信，并确认网址是以 https 开头的。</p>';
    return;
  }
  var saved = load(KEY_STORE);
  if (saved) {
    decryptWith(b64ToBytes(saved)).then(open).catch(function () { store(KEY_STORE, null); renderLock(''); });
  } else {
    renderLock('');
  }
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline copy is optional */ });
  }
})();

</script>
</body>
</html>
